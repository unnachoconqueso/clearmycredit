<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ClearMyCredit | Your information</title>
  <style>
    /* AQUÍ VA TODO TU CSS ORIGINAL DE form (7).html */
    body { font-family: system-ui, sans-serif; background: #f5f9ff; padding: 1.5rem; color: #0b1c2e; }
    .form-container { max-width: 700px; margin: 0 auto; background: white; border-radius: 2rem; padding: 2rem; box-shadow: 0 12px 30px rgba(0,0,0,0.05); }
    .step { display: none; }
    .step.active { display: block; }
    .progress-bar-bg { background: #e2edf7; border-radius: 40px; height: 8px; width: 100%; margin: 1rem 0; }
    .progress-fill { background: #1a4cff; height: 100%; width: 25%; border-radius: 40px; transition: 0.3s; }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.8rem; border: 1px solid #e2edf7; border-radius: 12px; font-size: 1rem; }
    .btn-group { display: flex; gap: 1rem; margin-top: 2rem; }
    button { flex: 1; padding: 1rem; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; }
    .btn-next { background: #1a4cff; color: white; }
    .btn-prev { background: #eef3ff; color: #1a4cff; }
  </style>
</head>
<body>
<div class="form-container">
  <h2>Your Information</h2>
  <div class="progress-bar-bg"><div class="progress-fill" id="fill"></div></div>

  <form id="disputeForm">
    <div class="step active" id="s1">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="fullName" required>
      </div>
      <div class="form-group">
        <label>Full Address</label>
        <input type="text" id="address" required>
      </div>
    </div>

    <div class="step" id="s2">
      <div class="form-group">
        <label>Creditor Name</label>
        <input type="text" id="creditor" required>
      </div>
      <div class="form-group">
        <label>Account Number (if known)</label>
        <input type="text" id="accountNumber">
      </div>
    </div>

    <div class="step" id="s3">
      <div class="form-group">
        <label>Dispute Reason</label>
        <select id="disputeReason">
          <option value="" disabled selected>Select a reason...</option>
          <option value="not_mine">This account does not belong to me</option>
          <option value="incorrect_balance">The balance is incorrect</option>
          <option value="paid_not_updated">Account is paid but shows open</option>
        </select>
      </div>
    </div>

    <div class="step" id="s4">
      <div class="form-group">
        <label>Legal Explanation</label>
        <textarea id="explanation" rows="6"></textarea>
      </div>
    </div>

    <div class="btn-group">
      <button type="button" class="btn-prev" id="prevBtn" style="display:none">Back</button>
      <button type="button" class="btn-next" id="nextBtn">Next</button>
    </div>
  </form>
</div>

<script>
  let step = 1;
  const templates = {
    "not_mine": "I have reviewed my credit report and this account does not belong to me. I request its immediate removal under FCRA guidelines.",
    "incorrect_balance": "The balance reported for this account is inaccurate. I request a verification of the amount reported.",
    "paid_not_updated": "This account was paid in full but still reflects as unpaid. I request an update to 'Paid/Closed' status."
  };

  document.getElementById('disputeReason').addEventListener('change', (e) => {
    document.getElementById('explanation').value = templates[e.target.value];
  });

  document.getElementById('nextBtn').onclick = () => {
    if (step < 4) {
      document.getElementById('s'+step).classList.remove('active');
      step++;
      document.getElementById('s'+step).classList.add('active');
      updateUI();
    } else {
      const data = {
        name: document.getElementById('fullName').value,
        addr: document.getElementById('address').value,
        cred: document.getElementById('creditor').value,
        acc: document.getElementById('accountNumber').value,
        exp: document.getElementById('explanation').value
      };
      localStorage.setItem('disputeData', JSON.stringify(data));
      window.location.href = 'preview.html';
    }
  };

  document.getElementById('prevBtn').onclick = () => {
    document.getElementById('s'+step).classList.remove('active');
    step--;
    document.getElementById('s'+step).classList.add('active');
    updateUI();
  };

  function updateUI() {
    document.getElementById('fill').style.width = (step*25) + '%';
    document.getElementById('prevBtn').style.display = step === 1 ? 'none' : 'block';
    document.getElementById('nextBtn').innerText = step === 4 ? 'Review Letter' : 'Next';
  }
</script>
</body>
</html>
