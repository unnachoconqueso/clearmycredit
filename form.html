<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ClearMyCredit | Tu información</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f5f9ff; padding: 1.5rem; color: #0b1c2e; }
    .form-container { max-width: 700px; margin: 0 auto; background: white; border-radius: 2rem; padding: 2rem 1.8rem; box-shadow: 0 12px 30px rgba(0,0,0,0.05); }
    .progress-bar-bg { background: #e2edf7; border-radius: 40px; height: 8px; width: 100%; margin: 1.5rem 0; overflow: hidden; }
    .progress-fill { background: #1a4cff; width: 25%; height: 100%; transition: 0.3s; }
    .step { display: none; animation: fade 0.3s ease; }
    .active-step { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .form-group { margin-bottom: 1.5rem; }
    label { font-weight: 600; display: block; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 0.9rem; border: 1.5px solid #e2edf7; border-radius: 15px; font-size: 1rem; }
    input:focus { border-color: #1a4cff; outline: none; }
    .button-group { display: flex; justify-content: space-between; gap: 1rem; margin-top: 2rem; }
    button { background: #1a4cff; color: white; border: none; padding: 1rem 2rem; border-radius: 40px; font-weight: 600; cursor: pointer; flex: 1; }
    button.secondary { background: #eef3ff; color: #1a4cff; }
  </style>
</head>
<body>
<div class="form-container">
  <h2>✍️ Crea tu disputa</h2>
  <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>

  <form id="wizardForm">
    <div class="step active-step" id="step1">
      <div class="form-group">
        <label>Nombre Legal Completo</label>
        <input type="text" id="fullName" placeholder="Ej. Juan Pérez" required>
      </div>
      <div class="form-group">
        <label>Dirección Postal</label>
        <input type="text" id="address" placeholder="Calle, Ciudad, Estado, ZIP" required>
      </div>
    </div>

    <div class="step" id="step2">
      <div class="form-group">
        <label>Nombre del Acreedor / Banco</label>
        <input type="text" id="creditor" placeholder="Ej. Chase Bank" required>
      </div>
      <div class="form-group">
        <label>Número de Cuenta (Opcional)</label>
        <input type="text" id="accountNumber" placeholder="XXXX-XXXX">
      </div>
    </div>

    <div class="step" id="step3">
      <div class="form-group">
        <label>Razón de la Disputa</label>
        <select id="disputeReason" required>
          <option value="" disabled selected>Selecciona una opción</option>
          <option value="not_mine">Esta cuenta no me pertenece</option>
          <option value="incorrect_balance">El saldo reportado es incorrecto</option>
          <option value="paid_but_not_updated">Ya pagué esta cuenta pero no se ha actualizado</option>
        </select>
      </div>
    </div>

    <div class="step" id="step4">
      <div class="form-group">
        <label>Explicación Detallada (Sugerida por el sistema)</label>
        <textarea id="explanation" rows="5" placeholder="Explica el error..."></textarea>
      </div>
    </div>

    <div class="button-group">
      <button type="button" id="prevBtn" class="secondary" style="display:none;">Atrás</button>
      <button type="button" id="nextBtn">Continuar →</button>
    </div>
  </form>
</div>

<script>
  let currentStep = 1;
  const totalSteps = 4;
  const templates = {
    not_mine: "He revisado mi informe de crédito y esta cuenta no me pertenece. No tengo registro de esta deuda y solicito su eliminación inmediata según la ley FCRA.",
    incorrect_balance: "El saldo reportado para esta cuenta es incorrecto. Solicito una verificación completa del monto adeudado y la corrección de cualquier cifra inflada.",
    paid_but_not_updated: "Esta cuenta fue liquidada en su totalidad. Sin embargo, sigue apareciendo como impagada. Adjunto el comprobante y solicito la actualización del estatus."
  };

  document.getElementById('disputeReason').addEventListener('change', (e) => {
    document.getElementById('explanation').value = templates[e.target.value] || "";
  });

  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');

  nextBtn.addEventListener('click', () => {
    if (currentStep < totalSteps) {
      currentStep++;
      updateUI();
    } else {
      saveData();
      window.location.href = 'preview.html';
    }
  });

  prevBtn.addEventListener('click', () => {
    currentStep--;
    updateUI();
  });

  function updateUI() {
    document.querySelectorAll('.step').forEach((s, i) => s.classList.toggle('active-step', i === currentStep - 1));
    document.getElementById('progressFill').style.width = `${(currentStep / totalSteps) * 100}%`;
    prevBtn.style.display = currentStep === 1 ? 'none' : 'block';
    nextBtn.innerText = currentStep === totalSteps ? 'Generar Vista Previa →' : 'Continuar →';
  }

  function saveData() {
    const data = {
      fullName: document.getElementById('fullName').value,
      address: document.getElementById('address').value,
      creditor: document.getElementById('creditor').value,
      accountNumber: document.getElementById('accountNumber').value,
      reason: document.getElementById('disputeReason').value,
      explanation: document.getElementById('explanation').value
    };
    localStorage.setItem('cmc_data', JSON.stringify(data));
  }
</script>
</body>
</html>
