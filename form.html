<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ClearMyCredit | Your information</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f5f9ff;
      padding: 1.5rem;
      color: #0b1c2e;
    }

    .form-container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 2rem;
      padding: 2rem 1.8rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.05);
    }

    h2 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .progress-section {
      margin: 1.5rem 0 1rem;
    }

    .progress-bar-bg {
      background: #e2edf7;
      border-radius: 40px;
      height: 8px;
      width: 100%;
      overflow: hidden;
    }

    .progress-fill {
      background: #1a4cff;
      width: 0%;
      height: 100%;
      border-radius: 40px;
      transition: width 0.2s ease;
    }

    .step-indicator {
      display: flex;
      justify-content: space-between;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      color: #5d6f83;
    }

    .time-note {
      font-size: 0.75rem;
      color: #1a4cff;
      background: #eef3ff;
      display: inline-block;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      margin-top: 0.5rem;
    }

    .step {
      display: none;
      animation: fade 0.2s ease;
    }

    .step.active-step {
      display: block;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .form-group {
      margin-bottom: 1.4rem;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.9rem 1rem;
      border: 1.5px solid #e2edf7;
      border-radius: 20px;
      font-size: 1rem;
      font-family: inherit;
      transition: 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #1a4cff;
      box-shadow: 0 0 0 3px rgba(26,76,255,0.1);
    }

    .button-group {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
    }

    button {
      background: #1a4cff;
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button.secondary {
      background: #eef3ff;
      color: #1a4cff;
    }

    button:hover {
      background: #0f3ad0;
    }

    button.secondary:hover {
      background: #e2e9f5;
    }

    .required-star:after {
      content: " *";
      color: #e53e3e;
    }

    small {
      color: #7c8ea0;
      font-size: 0.7rem;
    }

    @media (max-width: 550px) {
      .form-container { padding: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="form-container">
  <h2>✍️ Your dispute letter</h2>
  <div class="progress-section">
    <div class="progress-bar-bg"><div class="progress-fill" id="progressFill"></div></div>
    <div class="step-indicator">
      <span id="stepLabel">Step 1 of 4</span>
      <span class="time-note">⏱️ ~2 minutes total</span>
    </div>
  </div>

  <form id="wizardForm">
    <!-- STEP 1 - Personal info -->
    <div class="step active-step" id="step1">
      <div class="form-group">
        <label class="required-star">Full legal name</label>
        <input type="text" id="fullName" placeholder="John A. Doe" required>
      </div>
      <div class="form-group">
        <label class="required-star">Street address</label>
        <input type="text" id="address" placeholder="123 Main Street" required>
      </div>
      <div class="form-group">
        <label class="required-star">City</label>
        <input type="text" id="city" placeholder="Los Angeles" required>
      </div>
      <div class="form-row" style="display: flex; gap: 1rem; flex-wrap: wrap;">
        <div style="flex:1"><label class="required-star">State</label><input type="text" id="state" placeholder="CA" maxlength="2" required></div>
        <div style="flex:1"><label class="required-star">ZIP</label><input type="text" id="zip" placeholder="90210" required></div>
      </div>
    </div>

    <!-- STEP 2 - Account info -->
    <div class="step" id="step2">
      <div class="form-group">
        <label class="required-star">Creditor / bank name</label>
        <input type="text" id="creditor" placeholder="e.g., Chase Bank, LVNV Funding" required>
      </div>
      <div class="form-group">
        <label>Account number (optional)</label>
        <input type="text" id="accountNumber" placeholder="XXXXXXXX1234">
        <small>Helps to identify the account</small>
      </div>
    </div>

    <!-- STEP 3 - Dispute reason -->
    <div class="step" id="step3">
      <div class="form-group">
        <label class="required-star">Reason for dispute</label>
        <select id="disputeReason" required>
          <option value="" disabled selected>Select one</option>
          <option value="not_mine">Account does not belong to me</option>
          <option value="incorrect_balance">Incorrect balance or amount</option>
          <option value="paid_but_not_updated">Paid but still appears as unpaid</option>
          <option value="other">Other / explanation needed</option>
        </select>
      </div>
    </div>

    <!-- STEP 4 - Additional details -->
    <div class="step" id="step4">
      <div class="form-group">
        <label>Explain what is inaccurate (optional but recommended)</label>
        <textarea id="explanation" rows="4" placeholder="Describe why this item is wrong, e.g., 'I paid this debt in full on June 2023 and have a confirmation letter'"></textarea>
        <small>Be specific — helps your dispute</small>
      </div>
    </div>

    <div class="button-group">
      <button type="button" id="prevBtn" class="secondary" style="display: none;">← Back</button>
      <button type="button" id="nextBtn">Continue →</button>
    </div>
  </form>
</div>

<script>
  let currentStep = 1;
  const totalSteps = 4;
  const stepElements = {
    1: document.getElementById('step1'),
    2: document.getElementById('step2'),
    3: document.getElementById('step3'),
    4: document.getElementById('step4')
  };
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressFill = document.getElementById('progressFill');
  const stepLabelSpan = document.getElementById('stepLabel');

  function updateProgressAndUI() {
    const percent = ((currentStep - 1) / totalSteps) * 100;
    progressFill.style.width = `${percent}%`;
    stepLabelSpan.innerText = `Step ${currentStep} of ${totalSteps}`;

    for (let i = 1; i <= totalSteps; i++) {
      if (i === currentStep) stepElements[i].classList.add('active-step');
      else stepElements[i].classList.remove('active-step');
    }
    prevBtn.style.display = currentStep === 1 ? 'none' : 'inline-flex';
    if (currentStep === totalSteps) {
      nextBtn.innerText = 'Generate letter & preview →';
    } else {
      nextBtn.innerText = 'Continue →';
    }
  }

  function validateStep(step) {
    if (step === 1) {
      const name = document.getElementById('fullName').value.trim();
      const addr = document.getElementById('address').value.trim();
      const city = document.getElementById('city').value.trim();
      const state = document.getElementById('state').value.trim();
      const zip = document.getElementById('zip').value.trim();
      if (!name || !addr || !city || !state || !zip) {
        alert('Please fill all personal details (Name, Address, City, State, ZIP)');
        return false;
      }
    }
    if (step === 2) {
      const creditor = document.getElementById('creditor').value.trim();
      if (!creditor) {
        alert('Please enter the creditor / bank name');
        return false;
      }
    }
    if (step === 3) {
      const reason = document.getElementById('disputeReason').value;
      if (!reason) {
        alert('Please select a dispute reason');
        return false;
      }
    }
    return true;
  }

  function saveFormData() {
    const formData = {
      fullName: document.getElementById('fullName').value.trim(),
      address: document.getElementById('address').value.trim(),
      city: document.getElementById('city').value.trim(),
      state: document.getElementById('state').value.trim(),
      zip: document.getElementById('zip').value.trim(),
      creditor: document.getElementById('creditor').value.trim(),
      accountNumber: document.getElementById('accountNumber').value.trim(),
      disputeReason: document.getElementById('disputeReason').value,
      explanation: document.getElementById('explanation').value.trim()
    };
    localStorage.setItem('cmc_dispute_data', JSON.stringify(formData));
  }

  function loadStoredData() {
    const stored = localStorage.getItem('cmc_dispute_data');
    if (stored) {
      try {
        const data = JSON.parse(stored);
        if (data.fullName) document.getElementById('fullName').value = data.fullName;
        if (data.address) document.getElementById('address').value = data.address;
        if (data.city) document.getElementById('city').value = data.city;
        if (data.state) document.getElementById('state').value = data.state;
        if (data.zip) document.getElementById('zip').value = data.zip;
        if (data.creditor) document.getElementById('creditor').value = data.creditor;
        if (data.accountNumber) document.getElementById('accountNumber').value = data.accountNumber;
        if (data.disputeReason) document.getElementById('disputeReason').value = data.disputeReason;
        if (data.explanation) document.getElementById('explanation').value = data.explanation;
      } catch(e) {}
    }
  }

  nextBtn.addEventListener('click', () => {
    if (!validateStep(currentStep)) return;
    saveFormData();

    if (currentStep === totalSteps) {
      window.location.href = 'preview.html';
    } else {
      currentStep++;
      updateProgressAndUI();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (currentStep > 1) {
      currentStep--;
      updateProgressAndUI();
    }
  });

  loadStoredData();
  updateProgressAndUI();
</script>
</body>
</html>
