<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ClearMyCredit | Information & Signature</title>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --error: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            padding: 2rem 1rem;
        }
        .container {
            max-width: 780px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 32px;
            padding: 2rem 1.5rem 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0b2b3b;
        }
        .subhead {
            font-size: 1rem;
            color: var(--text-muted);
            border-left: 4px solid var(--primary);
            padding-left: 1rem;
            margin-bottom: 2rem;
        }
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .form-row .form-group {
            flex: 1;
            min-width: 120px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }
        input, select, textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            font-size: 1rem;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            transition: 0.2s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
        }
        input:invalid:not(:placeholder-shown) {
            border-color: var(--error);
        }
        .signature-area {
            margin: 1.5rem 0;
        }
        canvas {
            border: 2px solid var(--border);
            border-radius: 16px;
            background: white;
            width: 100%;
            height: 200px;
            touch-action: none;
            cursor: crosshair;
        }
        .btn-clear {
            background: #f1f5f9;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            font-size: 0.875rem;
            margin-top: 0.5rem;
            cursor: pointer;
        }
        .legal-check {
            margin: 1.5rem 0;
        }
        .legal-check label {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            font-weight: normal;
            cursor: pointer;
        }
        .legal-check input {
            width: auto;
            margin-top: 0.2rem;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            width: 100%;
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
            transform: scale(0.98);
        }
        .info-note {
            background: #eef3fa;
            padding: 1rem;
            border-radius: 24px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1.5rem;
        }
        .conditional-field {
            display: none;
        }
        .conditional-field.show {
            display: block;
        }
        @media (max-width: 550px) {
            .container { padding: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>✍️ ClearMyCredit</h1>
    <div class="subhead" data-en="Enter your details and sign below" data-es="Ingrese sus datos y firme a continuación">
        Enter your details and sign below
    </div>

    <form id="disputeForm" novalidate>
        <!-- Identity -->
        <div class="form-group">
            <label for="fullName" data-en="Full name *" data-es="Nombre completo *">Full name *</label>
            <input type="text" id="fullName" required placeholder="John A. Doe" autocomplete="name">
        </div>

        <div class="form-group">
            <label for="address" data-en="Street address *" data-es="Dirección *">Street address *</label>
            <input type="text" id="address" required placeholder="123 Main St" autocomplete="address-line1">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="city" data-en="City *" data-es="Ciudad *">City *</label>
                <input type="text" id="city" required placeholder="Springfield">
            </div>
            <div class="form-group">
                <label for="state" data-en="State *" data-es="Estado *">State *</label>
                <input type="text" id="state" required placeholder="IL" maxlength="2">
            </div>
            <div class="form-group">
                <label for="zip" data-en="ZIP *" data-es="Código postal *">ZIP *</label>
                <input type="text" id="zip" required placeholder="62701">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="dob" data-en="Date of birth *" data-es="Fecha de nacimiento *">Date of birth *</label>
                <input type="date" id="dob" required>
            </div>
            <div class="form-group">
                <label for="ssnLast4" data-en="SSN last 4 digits *" data-es="Últimos 4 dígitos del SSN *">SSN last 4 *</label>
                <input type="text" id="ssnLast4" required maxlength="4" pattern="\d{4}" placeholder="1234">
            </div>
        </div>

        <div class="form-group">
            <label for="email" data-en="Email address *" data-es="Correo electrónico *">Email address *</label>
            <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>

        <!-- Creditor -->
        <div class="form-group">
            <label for="creditor" data-en="Creditor / Bank name *" data-es="Acreedor / Banco *">Creditor / Bank name *</label>
            <input type="text" id="creditor" required placeholder="e.g., Chase Bank">
        </div>

        <div class="form-group">
            <label for="accountNumber" data-en="Account number *" data-es="Número de cuenta *">Account number *</label>
            <input type="text" id="accountNumber" required placeholder="XXXXXXXX1234">
        </div>

        <!-- Dispute details -->
        <div class="form-group">
            <label for="disputeType" data-en="Type of dispute *" data-es="Tipo de disputa *">Type of dispute *</label>
            <select id="disputeType" required>
                <option value="" disabled selected>Select one</option>
                <option value="incorrect_balance">Incorrect balance / amount</option>
                <option value="not_mine">Account not mine</option>
                <option value="paid_but_reported">Paid but still reported</option>
                <option value="duplicate">Duplicate account</option>
                <option value="fraud">Fraud / identity theft</option>
            </select>
        </div>

        <div class="form-group">
            <label for="explanation" data-en="Explain what is wrong *" data-es="Explique cuál es el error *">Explain what is wrong *</label>
            <textarea id="explanation" rows="3" required placeholder="Be specific: what is inaccurate, why, and any details..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="reportedAmount" data-en="Reported amount (if applicable)" data-es="Monto reportado (si aplica)">Reported amount ($)</label>
                <input type="number" id="reportedAmount" step="0.01" placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="correctAmount" data-en="Correct amount (if applicable)" data-es="Monto correcto (si aplica)">Correct amount ($)</label>
                <input type="number" id="correctAmount" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" id="evidenceAvailable"> 
                <span data-en="I have evidence to support my dispute" data-es="Tengo evidencia para respaldar mi disputa">I have evidence to support my dispute</span>
            </label>
        </div>

        <div id="evidenceGroup" class="conditional-field">
            <div class="form-group">
                <label for="evidenceDesc" data-en="Describe your evidence (e.g., payment confirmation, identity documents)" data-es="Describa su evidencia (ej. comprobante de pago, documentos de identidad)">Describe your evidence *</label>
                <textarea id="evidenceDesc" rows="2" placeholder="e.g., Payment confirmation from bank, copy of ID..."></textarea>
            </div>
        </div>

        <div class="signature-area">
            <label data-en="Your signature (draw with mouse or finger)" data-es="Su firma (dibuje con el mouse o dedo)">Your signature</label>
            <canvas id="signaturePad" width="600" height="200" style="width:100%; height:200px; touch-action:none;"></canvas>
            <button type="button" id="clearSignatureBtn" class="btn-clear" data-en="Clear Signature" data-es="Borrar firma">Clear Signature</button>
        </div>

        <div class="legal-check">
            <label>
                <input type="checkbox" id="legalConsent" required>
                <span data-en="I understand that ClearMyCredit is a self-help tool, not a credit repair agency, and provides no legal advice." 
                      data-es="Entiendo que ClearMyCredit es una herramienta de autoayuda, no una agencia de reparación de crédito, y no brinda asesoramiento legal.">
                    I understand that ClearMyCredit is a self-help tool, not a credit repair agency, and provides no legal advice.
                </span>
            </label>
        </div>

        <button type="submit" class="btn-submit" data-en="Continue to secure payment →" data-es="Continuar al pago seguro →">Continue to secure payment →</button>
        <div class="info-note" data-en="🔒 $9 one-time. After payment you’ll get an instant professional dispute letter ready to print & mail." data-es="🔒 $9 único. Después del pago recibirá al instante una carta profesional lista para imprimir y enviar.">
            🔒 $9 one-time. After payment you’ll get an instant professional dispute letter ready to print & mail.
        </div>
    </form>
</div>

<script>
    // Language handling
    const translatableElements = document.querySelectorAll('[data-en]');
    function setLanguage(lang) {
        translatableElements.forEach(el => {
            const text = el.getAttribute(`data-${lang}`);
            if (text) {
                if (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio') {
                    el.placeholder = text;
                } else if (el.tagName === 'TEXTAREA') {
                    el.placeholder = text;
                } else if (el.tagName === 'BUTTON' && el.classList.contains('btn-clear')) {
                    el.textContent = text;
                } else if (el.tagName === 'BUTTON' && el.classList.contains('btn-submit')) {
                    el.textContent = text;
                } else {
                    el.textContent = text;
                }
            }
        });
        localStorage.setItem('lang', lang);
    }
    const savedLang = localStorage.getItem('lang') || 'en';
    setLanguage(savedLang);

    // Evidence conditional field
    const evidenceCheckbox = document.getElementById('evidenceAvailable');
    const evidenceGroup = document.getElementById('evidenceGroup');
    const evidenceDesc = document.getElementById('evidenceDesc');
    function toggleEvidence() {
        if (evidenceCheckbox.checked) {
            evidenceGroup.classList.add('show');
            evidenceDesc.setAttribute('required', 'required');
        } else {
            evidenceGroup.classList.remove('show');
            evidenceDesc.removeAttribute('required');
        }
    }
    evidenceCheckbox.addEventListener('change', toggleEvidence);
    toggleEvidence();

    // Signature Pad
    const canvas = document.getElementById('signaturePad');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.clientWidth * ratio;
        canvas.height = canvas.clientHeight * ratio;
        ctx.scale(ratio, ratio);
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        const x = (clientX - rect.left) * (canvas.width / rect.width);
        const y = (clientY - rect.top) * (canvas.height / rect.height);
        return { x, y };
    }

    function startDrawing(e) {
        drawing = true;
        const { x, y } = getCoords(e);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y);
        ctx.stroke();
        e.preventDefault();
    }

    function draw(e) {
        if (!drawing) return;
        const { x, y } = getCoords(e);
        ctx.lineTo(x, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x, y);
        e.preventDefault();
    }

    function stopDrawing() {
        drawing = false;
        ctx.beginPath();
    }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);

    document.getElementById('clearSignatureBtn').addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    // Form submission
    const form = document.getElementById('disputeForm');
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        // Gather all fields
        const fullName = document.getElementById('fullName').value.trim();
        const address = document.getElementById('address').value.trim();
        const city = document.getElementById('city').value.trim();
        const state = document.getElementById('state').value.trim();
        const zip = document.getElementById('zip').value.trim();
        const dob = document.getElementById('dob').value;
        const ssnLast4 = document.getElementById('ssnLast4').value.trim();
        const email = document.getElementById('email').value.trim();
        const creditor = document.getElementById('creditor').value.trim();
        const account = document.getElementById('accountNumber').value.trim();
        const disputeType = document.getElementById('disputeType').value;
        const explanation = document.getElementById('explanation').value.trim();
        const reportedAmount = document.getElementById('reportedAmount').value;
        const correctAmount = document.getElementById('correctAmount').value;
        const evidenceAvailable = evidenceCheckbox.checked;
        const evidenceDescription = evidenceDesc.value.trim();

        // Basic validations
        if (!fullName || !address || !city || !state || !zip || !dob || !ssnLast4 || !email || !creditor || !account || !disputeType || !explanation) {
            alert("Please fill in all required fields.");
            return;
        }
        if (!/^\d{4}$/.test(ssnLast4)) {
            alert("SSN last 4 must be exactly 4 digits.");
            return;
        }
        const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailRegex.test(email)) {
            alert("Please enter a valid email address.");
            return;
        }
        if (evidenceAvailable && !evidenceDescription) {
            alert("Please describe your evidence.");
            return;
        }
        const legalConsent = document.getElementById('legalConsent').checked;
        if (!legalConsent) {
            alert("You must agree to the legal disclaimer to continue.");
            return;
        }

        // Save to localStorage
        localStorage.setItem('cmc_full_name', fullName);
        localStorage.setItem('cmc_address', address);
        localStorage.setItem('cmc_city', city);
        localStorage.setItem('cmc_state', state);
        localStorage.setItem('cmc_zip', zip);
        localStorage.setItem('cmc_date_of_birth', dob);
        localStorage.setItem('cmc_ssn_last4', ssnLast4);
        localStorage.setItem('cmc_email', email);
        localStorage.setItem('cmc_creditor', creditor);
        localStorage.setItem('cmc_account', account);
        localStorage.setItem('cmc_dispute_type', disputeType);
        localStorage.setItem('cmc_explanation', explanation);
        if (reportedAmount) localStorage.setItem('cmc_reported_amount', reportedAmount);
        if (correctAmount) localStorage.setItem('cmc_correct_amount', correctAmount);
        localStorage.setItem('cmc_evidence_available', evidenceAvailable ? 'true' : 'false');
        if (evidenceDescription) localStorage.setItem('cmc_evidence_description', evidenceDescription);
        
        const signatureData = canvas.toDataURL();
        localStorage.setItem('cmc_signature', signatureData);

        const currentLang = localStorage.getItem('lang') || 'en';
        localStorage.setItem('lang', currentLang);

        // Redirect to Stripe test link (ensure return URL is set to result.html?status=success or session_id)
        const stripeLink = 'https://buy.stripe.com/test_aFa9AV4ZK2vu9DRaPEbbG00';
        window.location.href = stripeLink;
    });
</script>
</body>
</html>
