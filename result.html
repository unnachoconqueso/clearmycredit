<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Payment Complete - ClearMyCredit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e6f0fa 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .card {
      background: white;
      border-radius: 2rem;
      padding: 2rem;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 35px -10px rgba(0,0,0,0.1);
    }
    .check {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }
    p {
      color: #334155;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #0f172a;
      color: white;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 1rem 0;
    }
    .loading-dots span {
      width: 8px;
      height: 8px;
      background: #0f172a;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    .security-note {
      background: #f1f5f9;
      padding: 1rem;
      border-radius: 16px;
      font-size: 0.8rem;
      margin-top: 1rem;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.7rem;
      color: #5d6f83;
    }
    footer a {
      color: #1a4cff;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="check">✅</div>
  <h2>Payment successful!</h2>
  <p>Your dispute letter is now unlocked. You'll be redirected to download it in a moment.</p>
  <a href="preview.html?payment=success" class="btn" id="redirectBtn">View my letter →</a>
  <div class="loading-dots"><span></span><span></span><span></span></div>
  <div class="security-note">
    <strong>🔒 Secure transaction</strong><br>
    Your payment was processed securely by Stripe. No card details were stored.
  </div>
</div>
<footer>
  <nav>
    <a href="privacy.html">Privacy</a> • 
    <a href="terms.html">Terms</a> • 
    <a href="disclaimer.html">Disclaimer</a> •
    <a href="cookies.html">Cookies</a>
  </nav>
</footer>
<script>
  window.CMC_CONFIG = { REDIRECT_DELAY: 2000 };
  function redirectToPreview() { window.location.href = 'preview.html?payment=success'; }
  function init() {
    try {
      localStorage.setItem('cmc_letter_paid', 'true');
      const SESSION_TIMEOUT = 24 * 60 * 60 * 1000;
      localStorage.setItem('cmc_session_expires', (Date.now() + SESSION_TIMEOUT).toString());
    } catch(e) {}
    setTimeout(redirectToPreview, CMC_CONFIG.REDIRECT_DELAY);
    document.getElementById('redirectBtn').addEventListener('click', function(e) {
      e.preventDefault();
      redirectToPreview();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
</body>
</html>
