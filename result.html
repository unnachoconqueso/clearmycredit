<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:;">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <title>Payment Complete - ClearMyCredit</title>
  <style>
    /* mantén tu CSS original */
  </style>
</head>
<body>
<div class="card">
  <div class="check">✅</div>
  <h2>Payment successful!</h2>
  <p>Your dispute letter is now unlocked. You'll be redirected to download it in a moment.</p>
  <a href="preview.html?payment=success" class="btn" id="redirectBtn">View my letter →</a>
  <div class="loading-dots"><span></span><span></span><span></span></div>
  <div class="security-note">
    <strong>🔒 Secure transaction</strong><br>
    Your payment was processed securely by Stripe. No card details were stored.
  </div>
</div>
<script>
  window.CMC_CONFIG = { REDIRECT_DELAY: 2000 };
  function redirectToPreview() { window.location.href = 'preview.html?payment=success'; }
  function init() {
    try {
      localStorage.setItem('cmc_letter_paid', 'true');
      const SESSION_TIMEOUT = 24 * 60 * 60 * 1000;
      localStorage.setItem('cmc_session_expires', (Date.now() + SESSION_TIMEOUT).toString());
    } catch(e) {}
    setTimeout(redirectToPreview, CMC_CONFIG.REDIRECT_DELAY);
    document.getElementById('redirectBtn').addEventListener('click', function(e) {
      e.preventDefault();
      redirectToPreview();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
</script>
<footer style="text-align: center; font-size: 0.75rem; margin-top: 1.5rem;">
  <nav>
    <a href="privacy.html">Privacy</a> • 
    <a href="terms.html">Terms</a> • 
    <a href="disclaimer.html">Disclaimer</a> •
    <a href="cookies.html">Cookies</a>
  </nav>
</footer>
</body>
</html>
