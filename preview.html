<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Your Letter | ClearMyCredit</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f9ff; padding: 2rem; color: #0b1c2e; }
    .container { max-width: 800px; margin: 0 auto; }
    .letter-paper { 
      background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      font-family: 'Courier New', monospace; position: relative; overflow: hidden;
    }
    .blur-overlay {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 60%;
      background: linear-gradient(transparent, white 50%); backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center; padding-bottom: 40px;
    }
    .pay-card {
      background: #1a4cff; color: white; padding: 2rem; border-radius: 20px; 
      text-align: center; margin-top: -40px; position: relative; z-index: 10;
    }
    .btn-pay { background: white; color: #1a4cff; padding: 1rem 2rem; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 1rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="letter-paper">
    <div id="letterBody"></div>
    <div class="blur-overlay"></div>
  </div>

  <div class="pay-card">
    <h3>Your letter is ready to download</h3>
    <p>Unlock the full FCRA-compliant PDF for just $19.00</p>
    <a href="TU_LINK_DE_STRIPE" class="btn-pay">Pay & Download PDF →</a>
  </div>
</div>

<script>
  const data = JSON.parse(localStorage.getItem('disputeData'));
  if(data) {
    document.getElementById('letterBody').innerHTML = `
      <p>${new Date().toLocaleDateString()}</p>
      <br>
      <p><strong>From:</strong> ${data.name}</p>
      <p>${data.addr}</p>
      <br>
      <p><strong>To:</strong> Dispute Department - ${data.cred}</p>
      <br>
      <p>Dear Sir/Madam,</p>
      <p>I am formally disputing account #${data.acc || 'XXXX'}.</p>
      <p>${data.exp}</p>
      <p style="color:#aaa">[Legal section blocked...]</p>
      <p style="color:#aaa">[FCRA citations blocked...]</p>
    `;
  }
</script>
</body>
</html>
