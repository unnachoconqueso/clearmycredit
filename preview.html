<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment complete - ClearMyCredit</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .card {
      background: white;
      max-width: 450px;
      padding: 2rem;
      border-radius: 2rem;
      text-align: center;
      box-shadow: 0 20px 30px rgba(0,0,0,0.05);
    }
    .check {
      font-size: 3rem;
    }
    h2 {
      margin: 1rem 0 0.5rem;
    }
    .btn {
      background: #1a4cff;
      color: white;
      border: none;
      padding: 0.8rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      margin-top: 1.5rem;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="check">✅</div>
  <h2>Payment successful!</h2>
  <p>Your dispute letter is now unlocked. You'll be redirected to download it.</p>
  <a href="preview.html?status=success" class="btn" id="redirectBtn">View my letter →</a>
</div>
<script>
  setTimeout(() => {
    window.location.href = 'preview.html?status=success';
  }, 1200);
</script>
</body>
</html>
